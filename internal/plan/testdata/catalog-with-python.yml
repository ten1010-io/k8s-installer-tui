# A filled catalog, in the format ansible/aipub_vars/catalog.yml describes. The tags
# are those of catalog-4.8.0.yml of aipub-installer-archive, harbor 2.14.0,
# cilium 1.19.2 and the monitoring images of charts/monitoring/values.yaml.
#
# Used by the tests (tests/aipub), and by hand to try a
# package that aipub-packager made without a catalog: copy it over
# /opt/k8s-installer/ansible/aipub_vars/catalog.yml, and push the same images into the
# user registry. The real one of a release comes from aipub-packager
