# ============================================================
#  사이트 설정 — 한 파일로 보는 값 (k8s-installer-tui 가 만든 보기)
#
#  ✅ = 반드시 채우는 값   ○ = 기본값이 있음. 주석 처리된 줄은 기본값 그대로
#  이 파일은 보기용이고 설치기는 읽지 않는다. 값이 실제로 저장되는 곳:
#    [K8S]       → group_vars/all/vars.yml   (k8s-installer)
#    [AIPUB]     → files/aipub/vars.yml      (aipub_* 만, 업그레이드에도 보존, 비밀 금지)
#    노드와 그룹은 [INVENTORY] → inventory.yml
#  constant-vars.yml 은 설치기 상수 — 절대 편집하지 않는다
#
#  "# preflight:" 는 실행 전에 확인할 것. 맨 아래에 모아 두었다
# ============================================================


# ────────────────────────────────────────────────────────────
#  [INVENTORY]  →  inventory.yml
# ────────────────────────────────────────────────────────────

### 노드 / 접속 ─────────────────────────────
ansible_host: {node1: "192.168.0.11", node2: "192.168.0.12"} # ✅ 노드 접속 주소 (IP)
# preflight: control node 에서 이 주소로 ssh 접속이 되어야 함
ansible_port: {node2: 2222}           # ○ (기본 22) SSH 포트 (비우면 22)
# ansible_user: null                  # ○ 이 노드만 다른 로그인 사용자 (비우면 vars.yml 의 ansible_user)
ki_cp_node: ["node1"]                 # ○ (기본 []) ki control plane 노드 (DNS·NTP·레지스트리·LB 를 돌림)
k8s_node: ["node1", "node2"]          # ✅ 쿠버네티스 노드 전체
k8s_cp: {node1: true}                 # ○ (기본 false) k8s 컨트롤 플레인(마스터) 노드
k8s_node_labels: {node1: {node-role.aipub.ten1010.io/control-plane: ""}} # ○ (기본 {}) 노드 라벨 (AIPub CP 노드에 node-role.aipub.ten1010.io/control-plane)
# broken_node: []                     # ○ 고장 나 작업에서 빼 둔 노드
control_node_ih: {localhost: "node1"} # ○ control node 가 될 ki cp 노드 (첫 번째 ki cp 노드)
# ansible_connection: "local"         # ○ control node(localhost) 는 로컬로 접속


# ────────────────────────────────────────────────────────────
#  [K8S]  →  group_vars/all/vars.yml
# ────────────────────────────────────────────────────────────

### 노드 / 접속 ─────────────────────────────
# ansible_user: "root"                # ○ 모든 노드에 로그인하는 사용자 (기본 root)

### 노드 디스크 / 커널 ──────────────────────
# ki_var_root_path: "/var/lib/k8s-installer" # ○ 설치기 상태 디렉터리
# docker_root_path: "/var/lib/docker" # ○ docker 데이터 디렉터리
# ephemeral_storage_device: null      # ○ kubelet 임시 저장소용 빈 블록 장치 (null=루트 파일시스템)
# kernel_cmdline_extra_args: []       # ○ 추가 커널 부팅 인자 (노드별로 inventory.yml 에)
# kernel_modules_extra: []            # ○ 추가로 올릴 커널 모듈
# sysctl_extra: {}                    # ○ 추가 sysctl

### 내부 네트워크 / ki-cp ───────────────────
internal_network_subnets: ["192.168.0.0/24"] # ✅ 노드와 ki-cp VIP 가 함께 드는 대역 (실제 넷마스크로)
# internal_network_extra_zone: null   # ○ 내부 DNS 가 답하는 추가 존 (aipub_ingress_zone 을 그대로 씀)
# internal_network_extra_zone_a_records: [] # ○ 추가 존의 A 레코드 (@, * → 인그레스 VIP)
# ki_cp_ha_mode: true                 # ○ ki control plane HA (VIP 사용)
ki_cp_ha_mode_vip: "192.168.0.10"     # ✅ (ki_cp_ha_mode=true 일 때 필수) ki-cp VIP
# preflight: internal_network_subnets 안의 비어 있는 IP 여야 arp 로 잡힘
# ki_cp_ha_mode_vip_carrier: "arp"    # ○ VIP 를 알리는 방식
# ki_cp_service_timezone: null        # ○ ki cp 서비스 로그 시간대 (null=노드 시간대)
ki_cp_dns_dnssec_validation: false    # ○ (기본 true) DNSSEC 검증
ki_cp_dns_server_upstream_servers: ["8.8.8.8", "8.8.4.4"] # ✅ ki cp DNS 의 상위 DNS 서버
ki_cp_ntp_server_upstream_servers: ["time1.google.com", "time2.google.com"] # ✅ ki cp NTP 의 상위 NTP 서버
# ki_cp_ntp_server_local_fallback: true # ○ 상위 NTP 가 끊기면 ki cp 시계를 나눠줌

### 쿠버네티스 ──────────────────────────────
k8s_pod_subnet: "10.244.0.0/16"       # ✅ 파드 대역 (CNI 에도 같은 값)
# preflight: 노드·서비스가 쓰는 망과 겹치지 않아야 함
k8s_service_subnet: "10.96.0.0/12"    # ✅ 서비스 대역
k8s_kube_proxy_enabled: false         # ○ (기본 true) kube-proxy 설치 (AIPub 이면 false — cilium 이 대체)
# preflight: 클러스터가 이미 있으면 바꿀 수 없음
k8s_minor_version: "1.36"             # ✅ 쿠버네티스 마이너 버전 (릴리스가 지원하는 것)
k8s_certificate_validity_period: "26280h" # ✅ 인증서 유효기간 (예: 26280h = 3년)

### 컨트롤 플레인 추가 인자 ─────────────────
k8s_apiserver_extra_args: [{name: "audit-policy-file", value: "/etc/kubernetes/audit-policy.yaml"}, {name: "audit-log-path", value: "/var/log/aipub/usage/audit.log"}, {name: "audit-log-maxage", value: "30"}, {name: "audit-log-maxbackup", value: "30"}, {name: "audit-log-maxsize", value: "100"}, {name: "runtime-config", value: "admissionregistration.k8s.io/v1beta1=true"}, {name: "authentication-config", value: "/etc/kubernetes/authentication-config.yaml"}, {name: "authentication-token-webhook-config-file", value: "/etc/kubernetes/webhook-token-auth.yaml"}, {name: "authentication-token-webhook-cache-ttl", value: "2m"}] # ○ (기본 []) kube-apiserver 추가 인자
# preflight: JWKS issuer "https://aipub.aipub.example.com" 가 컨트롤 플레인 노드에서 닿아야 함 (AIPub backend-gateway, A5 setup-aipub 뒤에 뜸; A5.2 update-cluster 에서 적용)
# preflight: CA /etc/k8s-installer/certs/ca.crt 는 A2 setup-cert 가 노드(컨트롤 노드 포함)에 둠; 있을 때만 authentication-config.yaml 을 씀 (없으면 A5.1 --fill-auth-config 가 만듦)
# preflight: CA 없이 update-cluster/노드 추가를 돌리면 설치기가 '소스 파일 없음'으로 거부합니다 (validate-hostvars.py, 노드는 그대로)
# preflight: 웹훅 URL "https://aipub.example.com/token-review" 이 컨트롤 플레인 노드에서 닿고 /etc/k8s-installer/certs/ca.crt 로 검증되는지 (A2.5 update-cluster 에서 적용)
k8s_apiserver_extra_volumes: [{name: "audit-policy", hostPath: "/etc/kubernetes/audit-policy.yaml", mountPath: "/etc/kubernetes/audit-policy.yaml", readOnly: true, pathType: "File"}, {name: "audit-log", hostPath: "/var/log/aipub/usage", mountPath: "/var/log/aipub/usage", pathType: "DirectoryOrCreate"}, {name: "authentication-config", hostPath: "/etc/kubernetes/authentication-config.yaml", mountPath: "/etc/kubernetes/authentication-config.yaml", readOnly: true, pathType: "File"}, {name: "webhook-token-auth", hostPath: "/etc/kubernetes/webhook-token-auth.yaml", mountPath: "/etc/kubernetes/webhook-token-auth.yaml", readOnly: true, pathType: "File"}, {name: "k8s-installer-certs", hostPath: "/etc/k8s-installer/certs", mountPath: "/etc/k8s-installer/certs", readOnly: true}] # ○ (기본 []) kube-apiserver 추가 host path 볼륨
# k8s_controller_manager_extra_args: [] # ○ kube-controller-manager 추가 인자
# k8s_controller_manager_extra_volumes: [] # ○ kube-controller-manager 추가 host path 볼륨
# k8s_scheduler_extra_args: []        # ○ kube-scheduler 추가 인자
# k8s_scheduler_extra_volumes: []     # ○ kube-scheduler 추가 host path 볼륨
# k8s_etcd_extra_args: []             # ○ etcd 추가 인자
k8s_cp_extra_files: [{src: "aipub/audit-policy.yaml", dest: "/etc/kubernetes/audit-policy.yaml", mode: "0644"}, {src: "aipub/authentication-config.yaml", dest: "/etc/kubernetes/authentication-config.yaml", mode: "0600"}, {src: "aipub/webhook-token-auth.yaml", dest: "/etc/kubernetes/webhook-token-auth.yaml", mode: "0644"}] # ○ (기본 []) 컨트롤 플레인 노드에 둘 파일 (비밀 금지)
# preflight: ansible/files/aipub/audit-policy.yaml 이 있어야 함 (없으면 위저드가 기본 정책을 씀, 있는 파일은 그대로 둠)
# preflight: ansible/files/aipub/authentication-config.yaml 이 있어야 함 (위저드가 issuer URL 과 CA 로 만듦, CA 가 생기기 전이면 A5.1 --fill-auth-config 가)
# preflight: ansible/files/aipub/webhook-token-auth.yaml 이 있어야 함 (위저드가 웹훅 URL 로 만듦)

### 실행 전 점검 / etcd 백업 ────────────────
# ki_preflight_disk_free_min: "10Gi"  # ○ 작업 전 필요한 디스크 여유 (null=검사 안 함)
# ki_preflight_disk_free_percent_min: 5 # ○ 작업 전 필요한 디스크 여유 % (null=검사 안 함)
# ki_preflight_clock_offset_max_seconds: 5 # ○ 허용하는 시계 오차(초) (null=검사 안 함)
# ki_etcd_backup_retention_count: 5   # ○ k8s cp 노드마다 남길 etcd 스냅숏 수

