# kubelet_eviction_hard_nodefs_available: null # ○ kubelet eviction hard nodefs available (null=노드 용량으로 계산)
# kubelet_eviction_hard_imagefs_available: null # ○ kubelet eviction hard imagefs available (null=노드 용량으로 계산)
# kubelet_eviction_hard_nodefs_inodes_free: "5%" # ○ kubelet eviction hard nodefs inodes free (null=노드 용량으로 계산)
