# kubelet_auto_memory_available_max: "4Gi" # ○ 계산한 예약값의 상한 (memory available)
# kubelet_auto_nodefs_available_min: "15Gi" # ○ 계산한 예약값의 하한 (nodefs available)
# kubelet_auto_nodefs_available_max: "50Gi" # ○ 계산한 예약값의 상한 (nodefs available)
# kubelet_auto_ephemeral_storage_min: "5Gi" # ○ 계산한 예약값의 하한 (ephemeral storage)
# kubelet_auto_ephemeral_storage_max: "30Gi" # ○ 계산한 예약값의 상한 (ephemeral storage)
# kubelet_cpu_manager_policy: "none"  # ○ CPU 할당 정책 (static=전용 코어)
# kubelet_cpu_manager_full_pcpus_only: false # ○ 전용 할당을 물리 코어 단위로 (static 일 때)
# kubelet_topology_manager_policy: "none" # ○ NUMA 정렬 정책
# kubelet_topology_manager_scope: "container" # ○ NUMA 정렬 단위
# kubelet_memory_manager_policy: "none" # ○ 메모리/hugepage NUMA 할당 정책
# kubelet_reserved_system_cpus: null  # ○ 시스템용으로 지정할 CPU 목록 (null=개수로만 예약)
# kubelet_server_tls_bootstrap: false # ○ kubelet 서빙 인증서를 클러스터에 요청 (승인 준비 뒤에)
# kubelet_max_pods: null              # ○ 노드당 최대 파드 수 (null=110)
# kubelet_ki_cp_extra_cpu: "500m"     # ○ ki cp 노드에 더 예약할 CPU
# kubelet_ki_cp_extra_memory: "1Gi"   # ○ ki cp 노드에 더 예약할 메모리


