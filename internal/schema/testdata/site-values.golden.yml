### 도메인 / 인그레스 / 로드밸런서 ──────────
aipub_load_balancers: [{name: "lb1", vip: "192.168.0.100", nodes: ["node1"]}] # ✅ L2 로 알리는 VIP (nodes 는 인벤토리 이름)
# preflight: nodes 의 이름이 inventory.yml 에 있어야 함
# aipub_default_ingress_class: {load_balancer: "lb1", host_network_port: 443} # ○ 기본 인그레스 클래스가 쓸 LB / 호스트 포트
# aipub_cilium_envoy_idle_timeout_seconds: 300 # ○ cilium envoy 유휴 타임아웃(초)
# aipub_cilium_hubble_relay_enabled: false # ○ hubble relay 설치
# aipub_cilium_hubble_ui_enabled: false # ○ hubble ui 설치
aipub_ingress_zone: "aipub.example.com" # ✅ AIPub 도메인 (예: aipub.example.com)
# preflight: `*.<이 도메인>` DNS 가 인그레스 VIP 를 가리켜야 외부에서 접속됨

### 인증서 ──────────────────────────────────
# aipub_cert_mode: "self_signed"      # ○ 인증서 방식
# aipub_preferred_runner_node: null   # ○ aipub 플레이북을 돌릴 노드 (비우면 첫 k8s cp 노드)

### Harbor / HA 스토리지 ────────────────────
# aipub_harbor_ingress_subdomain: "aipub-harbor" # ○ Harbor 서브도메인 (https://<여기>.<도메인>)
aipub_ha_mode: false                  # ○ (기본 true) true=스토리지클래스(RWX) / false=노드 로컬 디렉터리
# aipub_ha_mode_storage_class: "nfs-client" # ○ (aipub_ha_mode=true 일 때 필수) HA 볼륨의 StorageClass (ReadWriteMany)
aipub_harbor_replica_count: 1         # ○ (기본 3) Harbor 레플리카 수
aipub_harbor_local_pv_node: "node1"   # ✅ (aipub_ha_mode=false 일 때 필수) HA 가 아닐 때 Harbor 데이터를 둘 노드 (인벤토리 이름)
# aipub_harbor_registry_storage_size: "512Gi" # ○ Harbor registry 볼륨 크기
# aipub_harbor_postgresql_storage_size: "128Gi" # ○ Harbor postgresql 볼륨 크기
# aipub_harbor_redis_storage_size: "32Gi" # ○ Harbor redis 볼륨 크기
# aipub_harbor_trivy_storage_size: "5Gi" # ○ Harbor trivy 볼륨 크기
# aipub_harbor_admin_password: null   # ○ Harbor 관리자 비밀번호 (여기 말고 vault 에)

### AIPub 앱 ────────────────────────────────
# aipub_app_storage_class_name: null  # ○ HA 없이 프론트엔드에 보일 StorageClass (기본 aipub_ha_mode_storage_class)
# aipub_app_host_prefix: "aipub"      # ○ AIPub 서브도메인 (https://<여기>.<도메인>)
# aipub_app_edition: "enterprise"     # ○ 에디션
# aipub_app_file_storage_storage_class_name: null # ○ 백엔드 공유 볼륨 StorageClass (기본 aipub_app_storage_class_name)
# aipub_app_file_storage_size: "20Gi" # ○ 백엔드 공유 볼륨 크기
# aipub_app_file_storage_type: "dynamic" # ○ 백엔드 공유 볼륨 방식
# aipub_app_file_storage_static_type: null # ○ static 일 때의 종류 (local)
# aipub_app_file_storage_local_path: null # ○ static local 일 때 노드의 디렉터리
# aipub_app_file_storage_local_node_hostname: null # ○ static local 일 때 노드 (kubectl get nodes 의 이름)
# aipub_app_user_manage_enabled: false # ○ 오래 쓰지 않은 사용자를 INACTIVE 로 (되돌릴 수 없음)
# aipub_app_extra_values: []          # ○ 사이트 값 뒤에 줄 values 파일 (aipub_runner_node 경로)
# aipub_app_backoffice_admin_password: null # ○ 백오피스 관리자 비밀번호 (평문으로 복사됨)

### 배포 도구 ───────────────────────────────
# aipub_app_deploy_tool: "installer"  # ○ AIPub 배포 도구
# aipub_app_helmfile_bin: null        # ○ 다른 helmfile 을 쓸 때만 (기본 패키지의 것)
# aipub_monitoring_deploy_tool: "installer" # ○ 모니터링 배포 도구
# aipub_monitoring_helm_bin: "helm"   # ○ 모니터링이 쓰는 helm
# aipub_monitoring_helmfile_bin: null # ○ 모니터링이 쓰는 helmfile (기본 aipub_app_helmfile_bin 과 같음)
# aipub_monitoring_kustomize_bin: null # ○ 모니터링이 쓰는 kustomize (기본 helmfile 옆의 kustomize)
# aipub_monitoring_helmfile_dry_run: false # ○ helmfile 을 dry-run 으로만

### 모니터링 ────────────────────────────────
# aipub_monitoring_storage_class_name: null # ○ 모니터링 볼륨 StorageClass (기본 aipub_ha_mode_storage_class)
# aipub_monitoring_storage_type: null # ○ 모니터링 볼륨 방식 (기본: HA 면 dynamic, 아니면 static)
# aipub_monitoring_storage_static_type: "local" # ○ static 일 때의 종류
# aipub_monitoring_nfs_server: null   # ○ static nfs 일 때 NFS 서버
# aipub_monitoring_opensearch_storage_size: "3Ti" # ○ OpenSearch 볼륨 크기 (사이트 규모에 맞게)
# aipub_monitoring_opensearch_log_retention: "180d" # ○ OpenSearch 로그 보존 기간 (일 단위, 180d)
# aipub_monitoring_metrics_storage_size: "1Ti" # ○ VictoriaMetrics 볼륨 크기 (사이트 규모에 맞게)
# aipub_monitoring_metrics_retention_period: "180d" # ○ VictoriaMetrics 메트릭 보존 기간 (일 단위, 180d)
# aipub_monitoring_rightsizing_enabled: true # ○ 리소스 라이트사이징 스캔 (false 로 끄면 CronJob 이 없음)
# aipub_monitoring_api_replicas: 2    # ○ monitoring-api 레플리카 수
# aipub_monitoring_cp_nodes: []       # ○ OpenSearch·Alertmanager 레플리카가 뜰 노드 (비우면 k8s 컨트롤 플레인 노드 전부)
# aipub_monitoring_opensearch_disk_watermark_low: "85%" # ○ OpenSearch 디스크 워터마크 low
# aipub_monitoring_opensearch_disk_watermark_high: "90%" # ○ OpenSearch 디스크 워터마크 high
# aipub_monitoring_opensearch_disk_watermark_flood_stage: "95%" # ○ OpenSearch 디스크 워터마크 flood_stage


# ============================================================
#  실행 전 preflight 체크리스트 (위 "# preflight:" 를 모은 것)
#    [ ] ansible_host: control node 에서 이 주소로 ssh 접속이 되어야 함
#    [ ] ki_cp_ha_mode_vip: internal_network_subnets 안의 비어 있는 IP 여야 arp 로 잡힘
#    [ ] k8s_pod_subnet: 노드·서비스가 쓰는 망과 겹치지 않아야 함
#    [ ] k8s_kube_proxy_enabled: 클러스터가 이미 있으면 바꿀 수 없음
#    [ ] k8s_apiserver_extra_args: JWKS issuer "https://aipub.aipub.example.com" 가 컨트롤 플레인 노드에서 닿아야 함 (AIPub backend-gateway, A5 setup-aipub 뒤에 뜸; A5.2 update-cluster 에서 적용)
#    [ ] k8s_apiserver_extra_args: CA /etc/k8s-installer/certs/ca.crt 는 A2 setup-cert 가 노드(컨트롤 노드 포함)에 둠; 있을 때만 authentication-config.yaml 을 씀 (없으면 A5.1 --fill-auth-config 가 만듦)
#    [ ] k8s_apiserver_extra_args: CA 없이 update-cluster/노드 추가를 돌리면 설치기가 '소스 파일 없음'으로 거부합니다 (validate-hostvars.py, 노드는 그대로)
#    [ ] k8s_apiserver_extra_args: 웹훅 URL "https://aipub.example.com/token-review" 이 컨트롤 플레인 노드에서 닿고 /etc/k8s-installer/certs/ca.crt 로 검증되는지 (A2.5 update-cluster 에서 적용)
#    [ ] k8s_cp_extra_files: ansible/files/aipub/audit-policy.yaml 이 있어야 함 (없으면 위저드가 기본 정책을 씀, 있는 파일은 그대로 둠)
#    [ ] k8s_cp_extra_files: ansible/files/aipub/authentication-config.yaml 이 있어야 함 (위저드가 issuer URL 과 CA 로 만듦, CA 가 생기기 전이면 A5.1 --fill-auth-config 가)
#    [ ] k8s_cp_extra_files: ansible/files/aipub/webhook-token-auth.yaml 이 있어야 함 (위저드가 웹훅 URL 로 만듦)
#    [ ] aipub_load_balancers: nodes 의 이름이 inventory.yml 에 있어야 함
#    [ ] aipub_ingress_zone: `*.<이 도메인>` DNS 가 인그레스 VIP 를 가리켜야 외부에서 접속됨
# ============================================================
