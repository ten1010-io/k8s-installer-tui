# new-site-non-ha with every preset of the control plane screen on and an entry
# typed in for the controller manager, the way the tool reads a site back: the
# presets are the lists holding all of their entries. JWKS and the legacy webhook
# are both on, as a site moving from one to the other runs them; files/aipub has
# no authentication-config.yaml, so the issuer is derived from the zone. The CA
# setup-cert would put on the control node is jwks-ca.crt next to this, a public
# test certificate (simulate.sh passes it as --jwks-ca); the authentication
# config is written with it
ki_cp_ha_mode: false
k8s_apiserver_extra_args:
  - name: audit-policy-file
    value: /etc/kubernetes/audit-policy.yaml
  - name: audit-log-path
    value: /var/log/aipub/usage/audit.log
  - name: audit-log-maxage
    value: 30
  - name: audit-log-maxbackup
    value: 30
  - name: audit-log-maxsize
    value: 100
  - name: runtime-config
    value: admissionregistration.k8s.io/v1beta1=true
  - name: authentication-config
    value: /etc/kubernetes/authentication-config.yaml
  - name: authentication-token-webhook-config-file
    value: /etc/kubernetes/webhook-token-auth.yaml
  - name: authentication-token-webhook-cache-ttl
    value: 2m
k8s_apiserver_extra_volumes:
  - name: audit-policy
    hostPath: /etc/kubernetes/audit-policy.yaml
    mountPath: /etc/kubernetes/audit-policy.yaml
    readOnly: true
    pathType: File
  - name: audit-log
    hostPath: /var/log/aipub/usage
    mountPath: /var/log/aipub/usage
    pathType: DirectoryOrCreate
  - name: authentication-config
    hostPath: /etc/kubernetes/authentication-config.yaml
    mountPath: /etc/kubernetes/authentication-config.yaml
    readOnly: true
    pathType: File
  - name: webhook-token-auth
    hostPath: /etc/kubernetes/webhook-token-auth.yaml
    mountPath: /etc/kubernetes/webhook-token-auth.yaml
    readOnly: true
    pathType: File
  - name: k8s-installer-certs
    hostPath: /etc/k8s-installer/certs
    mountPath: /etc/k8s-installer/certs
    readOnly: true
k8s_controller_manager_extra_args:
  - name: node-cidr-mask-size
    value: 24
k8s_cp_extra_files:
  - src: aipub/audit-policy.yaml
    dest: /etc/kubernetes/audit-policy.yaml
    mode: "0644"
  - src: aipub/authentication-config.yaml
    dest: /etc/kubernetes/authentication-config.yaml
    mode: "0600"
  - src: aipub/webhook-token-auth.yaml
    dest: /etc/kubernetes/webhook-token-auth.yaml
    mode: "0644"
